@if (isOpen()) {
  <div
    #contextMenu
    class="ui-bg fixed flex min-w-32 flex-col rounded-lg p-1.5 shadow-xl"
    [style.left.px]="x()"
    [style.top.px]="y()"
    [style.visibility]="isPositioned() ? 'visible' : 'hidden'"
    animate.enter="in"
    animate.leave="out"
    (mousedown)="onMenuMouseDown($event)"
  >
    @let contentType = this.contentType();
    @switch (contentType) {
      @case ('route') {
        <app-route-context-menu />
      }
      @case ('stage') {
        <app-stage-context-menu />
      }
      @default never(contentType);
    }
  </div>
}
