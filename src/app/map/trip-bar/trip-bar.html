<div class="relative flex h-full items-center gap-2">
  @for (route of trip().routes; track route.id) {
    <app-route
      [route]="route"
      [renderedOnce]="renderedOnce()"
      [isOnly]="trip().routes.length === 1"
    />
  } @empty {
    <button
      class="flex h-full items-center overflow-hidden rounded-lg border border-dashed border-white bg-white/80 p-1 px-2 text-sm text-nowrap"
      (click)="createRoute()"
      (animate.enter)="onEmptyEnter($event)"
    >
      + Create route
    </button>
  }
  @if (trip().routes.length > 0) {
    <button
      type="button"
      id="create-route-button"
      class="h-8 w-4 rounded bg-white/90 text-sm opacity-0 transition-opacity duration-200"
      (click)="createRoute()"
    >
      +
    </button>
  }
</div>
