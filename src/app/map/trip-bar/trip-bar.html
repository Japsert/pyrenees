@for (route of routes(); track $index) {
  <div
    class="h-full bg-white rounded-lg flex flex-col pb-0.5"
    (mousedown)="setSelectedRoute(route)"
  >
    <div class="flex justify-center text-xs text-gray-400 text-nowrap">
      <app-text-field
        [text]="route.name"
        placeholder="Route name"
        (textChange)="setRouteName(route, $event)"
      />
    </div>
    @for (stage of route.stages(); track $index) {
      <div class=""></div>
    } @empty {
      <button
        class="grow ml-1 mr-2 rounded-lg border border-dashed border-gray-200 p-1 px-2 text-sm text-gray-400 text-nowrap"
      >
        + Create route
      </button>
    }
  </div>
}
