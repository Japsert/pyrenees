<div class="route flex h-full flex-col overflow-hidden rounded-lg bg-ui dark:bg-ui-dark pb-0.75">
  <button
    class="flex h-5 items-center justify-center text-xs text-nowrap text-neutral-400 dark:text-neutral-300"
    (contextmenu)="onRouteRightClick(route(), $event)"
  >
    {{ route().name }}
  </button>
  <div class="relative mx-0.75 flex grow gap-1">
    @for (stage of route().stages; track stage.id) {
      <app-stage
        [route]="route()"
        [stage]="stage"
        [renderedOnce]="renderedOnce()"
        [isOnly]="route().stages.length === 1"
      />
    } @empty {
      <button
        class="h-7.5 overflow-hidden rounded-md border-2 border-dashed border-neutral-200 dark:border-neutral-500 px-2 text-sm text-nowrap text-neutral-400 dark:text-neutral-300"
        (click)="createStage(route())"
        (contextmenu)="onRouteRightClick(route(), $event)"
        (animate.enter)="onEmptyEnter($event)"
      >
        + Create stage
      </button>
    }
    @if (route().stages.length > 0) {
      <button
        type="button"
        class="create-stage-button -ml-1 w-0 overflow-hidden rounded border-dashed border-neutral-200 dark:border-neutral-500 px-0 text-sm text-nowrap transition-all"
        (click)="createStage(route())"
      >
        +
      </button>
    }
  </div>
</div>
