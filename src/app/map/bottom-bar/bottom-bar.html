<div class="w-20 shrink-0 flex flex-col gap-2">
  <button
    class="h-10 cursor-pointer bg-white rounded-lg transition {{
      this.isFlying()
        ? 'inset-shadow-flying hover:inset-shadow-flying-hover active:inset-shadow-flying-active'
        : 'hover:inset-shadow-hover active:inset-shadow-active'
    }}"
    (click)="toggleFly()"
  >
    {{ this.isFlying() ? '🛬 Stop' : '🛫 Fly' }}
  </button>
  <app-style-switcher class="h-20" />
</div>

<div #routeInfo class="w-full bg-white rounded-lg shadow flex">
  <div #routeStats class="w-fit grid grid-cols-[max-content_max-content] grid-rows-4 gap-2 p-4">
    <div class="stat-key">length</div>
    <div class="stat-value">
      {{ length() }}
      <span class="unit"> km</span>
    </div>
    <div class="stat-key">total asc.</div>
    <div class="stat-value">
      {{ totalAscent() }}
      <span class="unit"> m</span>
    </div>
    <div class="stat-key">net asc.</div>
    <div class="stat-value">
      {{ netAscent() }}
      <span class="unit"> m</span>
    </div>
    <div class="stat-key">time</div>
    <div class="stat-value">
      <span class="stat-value">{{ timeH() }}</span>
      <span class="unit">h</span>
      <span class="inline-block w-1"></span>
      <span class="stat-value">{{ timeM() }}</span>
      <span class="unit">m</span>
    </div>
  </div>
  <app-height-map class="w-full" />
</div>
