<span class="w-fit! px-1 whitespace-nowrap text-neutral-800 dark:text-neutral-200"
  >Clear route?</span
>
<button
  class="w-fit rounded-lg border border-red-300 bg-red-200 px-2 text-red-700 dark:border-red-800 dark:bg-red-900 dark:text-red-300"
  (click)="clear()"
>
  Clear
</button>
<button class="w-fit rounded-lg border-0 bg-neutral-200 dark:bg-neutral-600 text-neutral-800 dark:text-neutral-200 px-2" (click)="cancel()">Cancel</button>
