<button title="Undo" (click)="undo()" [disabled]="!canUndo()">↩</button>
<button title="Redo" (click)="redo()" [disabled]="!canRedo()">↪</button>
<button title="Edit route" (click)="edit()" [attr.aria-pressed]="isEditing()">✏️</button>
<div class="relative inline-block border-t border-t-[#ddd]" (mousedown)="$event.stopPropagation()">
  <button title="Clear route" (click)="toggleShowConfirmClear()" [disabled]="!canClear()">
    🗑️
  </button>
  @if (showConfirmClear()) {
    <div class="absolute top-1/2 -translate-y-1/2 right-full mr-4">
      <app-confirm-clear (confirmed)="clear()" (cancelled)="cancelClear()" />
    </div>
  }
</div>
<button title="Export" (click)="export()" class="border-t! border-t-[#ddd]!">📤</button>
<button title="Import" (click)="import()">📥</button>
