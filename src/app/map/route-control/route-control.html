<button
  title="Undo"
  (click)="undo()"
  [disabled]="!canUndo()"
  class="control transition duration-100"
>
  ↩
</button>
<button
  title="Redo"
  (click)="redo()"
  [disabled]="!canRedo()"
  class="control transition duration-100"
>
  ↪
</button>
<button title="Edit route" (click)="edit()" [attr.aria-pressed]="isEditingRoute()" class="control">
  ✏️
</button>
<div (mousedown)="$event.stopPropagation()" class="control relative inline-block">
  <button
    title="Clear route"
    (click)="toggleShowConfirmClear()"
    [disabled]="!canClear()"
    class="transition duration-100"
  >
    🗑️
  </button>
  @if (showConfirmClear()) {
    <div class="absolute top-1/2 right-full mr-4 -translate-y-1/2">
      <app-confirm-clear (confirmed)="clear()" (cancelled)="cancelClear()" />
    </div>
  }
</div>
<button title="Export" (click)="export()" class="control">📤</button>
<button title="Import" (click)="import()" class="control">📥</button>
<button title="Debug" (click)="debug()" class="control">🐛</button>
