<button
  class="border-ui dark:border-ui-dark h-full w-full cursor-pointer overflow-hidden rounded-lg border-6"
  (click)="switchStyle()"
>
  <div
    class="h-full w-full transition-colors duration-200 {{
      isStyleOutdoor() ? 'bg-green-900' : 'bg-amber-50 dark:bg-neutral-700'
    }}"
  ></div>
</button>
