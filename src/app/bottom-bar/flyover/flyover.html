<button
  class="w-full h-full cursor-pointer ui-bg text-neutral-800 dark:text-neutral-200 rounded-lg transition shadow-xl {{
    isFlying() ? '' : ''
  }} pointer-events-auto disabled:cursor-not-allowed"
  (click)="toggleFly($event)"
  [disabled]="!canFly()"
>
  {{ isFlying() ? '🛬 Stop' : '🛫 Fly' }}
</button>
